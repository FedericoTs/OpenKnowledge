# Builds the Windows deliverable: the PyInstaller bundle, the bundled
# llama.cpp server, and the Inno Setup installer - then smoke-tests the
# frozen executables on a real Windows machine before anything is published.
#
# "The suite is green" says nothing about a frozen bundle: PyInstaller's
# import graph, data-file collection and console behaviour fail in ways no
# test imports can see. So this job runs the built .exe itself: `paths`,
# `--version`, and an actual serve with a /healthz probe.
#
# Runs on packaging changes and on demand - not on every push, because a
# full Windows build is minutes, and the packaging inputs are exactly the
# paths listed below.

name: Package

on:
  workflow_dispatch:
  # release.yml reuses this whole workflow so a published installer is built
  # and proven by exactly the pipeline that gates every packaging change.
  workflow_call:
  push:
    branches: ["main"]
    paths:
      - "packaging/**"
      - "src/openknowledge/desktop/**"
      - "pyproject.toml"
      - "web/**"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "src/openknowledge/desktop/**"
      - "pyproject.toml"
      - ".github/workflows/package.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # auth is in the bundle so a company server on Windows can turn
        # sign-in on without a second install; with OK_AUTH_MODE=off (the
        # default) none of it is ever imported.
        run: uv venv --python 3.12 && uv pip install -e ".[desktop,packaging,anthropic,auth]"

      # An installer whose manifest no longer matches upstream would ship a
      # first run that can only fail its own hash check. Two HEAD requests
      # prove the pinned bytes are still served before anything is built.
      - name: The model manifest still matches upstream
        run: uv run python tools/verify_model_manifest.py

      - name: Build the bundle
        run: uv run pyinstaller packaging/pyinstaller/openknowledge.spec --noconfirm

      - name: The frozen CLI runs
        shell: pwsh
        run: |
          # Both executables must exist as distinct files - the first Windows
          # build lost the console exe to a case-insensitive name collision
          # and every command below silently ran the windowed launcher.
          foreach ($exe in "openknowledge.exe","OpenKnowledgeApp.exe") {
            if (-not (Test-Path "dist\OpenKnowledge\$exe")) { throw "$exe missing from the bundle" }
          }
          $env:OK_STATE_DIR = "$env:TEMP\ok-smoke"
          $v = & dist\OpenKnowledge\openknowledge.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          if (-not $v) { throw "--version printed nothing (GUI-subsystem exe? console exe lost?)" }
          # It must print the RIGHT version, not merely something. Without the
          # bundled dist-info the app reads its own version as 0.0.0, and the
          # updater then compares every release against that - offering an
          # update to a build that is already current. "Printed something"
          # passed happily through that for four releases.
          $expected = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("$v".Trim() -notmatch [regex]::Escape($expected)) {
            throw "frozen --version said '$v' but pyproject says '$expected' (dist-info missing from the bundle?)"
          }
          & dist\OpenKnowledge\openknowledge.exe paths
          if ($LASTEXITCODE -ne 0) { throw "paths exited $LASTEXITCODE" }

      - name: The frozen bundle carries sign-in
        shell: pwsh
        run: |
          # v0.1.4 shipped before auth existed, and a field tester lost an
          # evening to a .env that could not do anything. Prove the auth
          # module rides in the bundle: with sign-in half-configured the
          # server must refuse naming the missing setting - the config
          # error. An import error would mean PyJWT never made it in.
          $env:OK_STATE_DIR = "$env:TEMP\ok-auth-smoke"
          $env:OK_AUTH_MODE = "oidc"
          $env:OK_OIDC_CLIENT_ID = "smoke"
          & dist\OpenKnowledge\openknowledge.exe serve --port 18096 2> auth-smoke.log
          # The exe MUST exit non-zero here - that is the smoke passing - so
          # the step owns its own exit code rather than inheriting the exe's.
          $code = $LASTEXITCODE
          $log = Get-Content auth-smoke.log -Raw
          if ($code -eq 0) { throw "half-configured sign-in served anyway" }
          if ($log -notmatch "OK_OIDC_ISSUER") {
            Write-Host $log
            throw "expected the missing-issuer config error; the auth module may be absent from the bundle"
          }
          $global:LASTEXITCODE = 0

      - name: The frozen server serves
        shell: pwsh
        run: |
          $env:OK_STATE_DIR = "$env:TEMP\ok-smoke"
          $p = Start-Process -FilePath dist\OpenKnowledge\openknowledge.exe `
            -ArgumentList "serve","--port","18095" -PassThru -NoNewWindow `
            -RedirectStandardOutput serve-out.log -RedirectStandardError serve-err.log
          $ok = $false
          foreach ($i in 1..60) {
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:18095/healthz" -TimeoutSec 2
              if ($r.status -eq "ok") { $ok = $true; break }
            } catch { Start-Sleep -Milliseconds 500 }
          }
          $widget = (Invoke-WebRequest -Uri "http://127.0.0.1:18095/" -TimeoutSec 5).Content
          $manage = (Invoke-WebRequest -Uri "http://127.0.0.1:18095/manage" -TimeoutSec 5).Content
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content serve-out.log, serve-err.log; throw "healthz never answered" }
          if ($widget -notmatch "OpenKnowledge") { throw "widget page did not serve" }
          if ($manage -notmatch "Manage") { throw "manage page did not serve" }

      - name: Bundle llama.cpp (win-vulkan)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/fetch-llama.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            packaging\windows\installer.iss

      - name: The installer installs, the installed app answers
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\OpenKnowledge-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\OpenKnowledge"
          if (-not (Test-Path "$app\OpenKnowledgeApp.exe")) { throw "windowed exe missing after install" }
          if (-not (Test-Path "$app\llama\llama-server.exe")) { throw "llama-server missing after install" }
          $env:OK_STATE_DIR = "$env:TEMP\ok-installed"
          & "$app\openknowledge.exe" paths
          if ($LASTEXITCODE -ne 0) { throw "installed CLI exited $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: OpenKnowledge-Setup
          path: dist/installer/OpenKnowledge-Setup-*.exe
          if-no-files-found: error

  # Can an install that already exists receive this build? Every release so
  # far proved only that the installer works on a clean machine, which is the
  # one case an existing user is never in. The whole update feature - check,
  # download, verify, hand off to the installer - ends in this silent upgrade,
  # and it had never once been run.
  #
  # The previous release is the one GitHub calls latest while this job runs:
  # package.yml builds before release.yml publishes. If there is no earlier
  # release, or it is this same version, there is nothing to upgrade from and
  # the job says so rather than inventing a pass.
  #
  # The command the app actually builds is pinned by unit tests (quoting,
  # ordering, an apostrophe in the account name). What only a Windows machine
  # can answer is whether the installer replaces a running install silently
  # and leaves the user's state where it was, so that is what runs here.
  windows-upgrade:
    needs: windows-installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Two installs and a 75 MB download; the green run took nineteen seconds.
    # A silent installer that decides to wait for something has nobody to
    # answer it, and without this it waits for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: OpenKnowledge-Setup

      - name: Upgrade a real previous install, and keep its state
        id: upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Invoke-WebRequest renders a progress bar even with no console to
          # render it to, and on a large file that dominates the transfer -
          # tens of minutes for a download that takes seconds without it.
          $ProgressPreference = 'SilentlyContinue'

          $new = Get-ChildItem OpenKnowledge-Setup-*.exe | Select-Object -First 1
          $newVersion = ($new.Name -replace '^OpenKnowledge-Setup-', '') -replace '\.exe$', ''
          Write-Host "built: $newVersion"

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          # A job that quietly declines to run looks exactly like a job that
          # passed. Every exit here says so on the run's summary page, and on
          # a release it is fatal: publishing a build nothing upgraded to is
          # the whole thing this job exists to prevent.
          $isRelease = "${{ github.ref_type }}" -eq "tag" -or "${{ inputs.tag }}" -ne ""
          function Skip([string]$why) {
            $line = "windows-upgrade DID NOT RUN: $why"
            Write-Host "::warning::$line"
            if ($env:GITHUB_STEP_SUMMARY) { "**$line**" | Out-File $env:GITHUB_STEP_SUMMARY -Append }
            if ($isRelease) { throw "$line - a release must not publish unproven" }
            exit 0
          }

          try {
            $release = Invoke-RestMethod -Uri $api -Headers $headers
          } catch {
            Skip "no published release to upgrade from yet"
          }
          $asset = $release.assets | Where-Object { $_.name -like 'OpenKnowledge-Setup-*.exe' } | Select-Object -First 1
          if (-not $asset) { Skip "the previous release carries no installer" }
          $oldVersion = ($asset.name -replace '^OpenKnowledge-Setup-', '') -replace '\.exe$', ''
          if ($oldVersion -eq $newVersion) {
            Skip "the latest release is already $newVersion, so there is no earlier build to upgrade from"
          }
          Write-Host "upgrading from: $oldVersion ($(Get-Date -Format HH:mm:ss))"

          # No auth header here: the download redirects to a CDN that can
          # reject one, and a public release asset needs none.
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile old-setup.exe
          $p = Start-Process -FilePath (Resolve-Path old-setup.exe) `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=install-old.log" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installing $oldVersion exited $($p.ExitCode)" }

          $app = "$env:LOCALAPPDATA\Programs\OpenKnowledge"
          $installed = (& "$app\openknowledge.exe" --version) -join ''
          if ($installed -notmatch [regex]::Escape($oldVersion)) {
            throw "expected the previous build $oldVersion, got '$installed'"
          }

          # A file this build does not ship, standing in for every module, DLL
          # and data file a past version left behind. Inno replaces files and
          # removes nothing, so before the runtime was cleared wholesale this
          # survived every upgrade - which is how a stale .dist-info once made
          # the app report the version it had just replaced, for ever.
          $stale = "$app\_internal\left-by-an-older-build.txt"
          Set-Content -Path $stale -Value "shipped by $oldVersion, not by $newVersion"
          # Assert it is there before asserting it is gone. A test that never
          # planted the file passes exactly like one that planted it and saw it
          # removed, and the two are indistinguishable from the log.
          if (-not (Test-Path $stale)) { throw "could not plant the stale file at $stale" }

          # Stand in for everything a person would lose: their documents, the
          # answer store, the admin token. App mode puts all of it here.
          $state = "$env:LOCALAPPDATA\OpenKnowledge"
          New-Item -ItemType Directory -Force -Path "$state\documents" | Out-Null
          Set-Content -Path "$state\documents\keep-me.md" -Value "# Keep me`nThe office closes at 18:00."
          Set-Content -Path "$state\.env" -Value "OK_ADMIN_TOKEN=upgrade-marker"

          # The upgrade itself, with the flags the app hands the installer.
          $p = Start-Process -FilePath $new.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=install-new.log" `
            -Wait -PassThru
          Write-Host "upgrade installer exited $($p.ExitCode)"

          $after = (& "$app\openknowledge.exe" --version) -join ''
          if ($after -notmatch [regex]::Escape($newVersion)) {
            # Say why, rather than only that. Inno's own log is the primary
            # artifact here; the directory listing catches a second install
            # that landed somewhere else entirely.
            Write-Host "--- installed exes ---"
            Get-ChildItem $app -Filter *.exe | Format-Table Name, Length, LastWriteTime | Out-String | Write-Host
            Write-Host "--- other OpenKnowledge install directories ---"
            Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
              -Filter "OpenKnowledge*" -ErrorAction SilentlyContinue |
              Select-Object FullName | Out-String | Write-Host
            # The app reads its own version out of bundled .dist-info, whose
            # directory name carries that version. Inno replaces files; it
            # does not remove ones the new build no longer has.
            Write-Host "--- metadata the frozen app can see ---"
            Get-ChildItem "$app\_internal" -Filter "openknowledge-*.dist-info" -ErrorAction SilentlyContinue |
              Select-Object Name | Out-String | Write-Host
            Write-Host "--- Inno log, upgrade ---"
            if (Test-Path install-new.log) { Get-Content install-new.log -Tail 120 | Write-Host }
            throw "upgrade left $oldVersion in place: --version says '$after' (installer exit $($p.ExitCode))"
          }
          if (-not (Test-Path "$state\documents\keep-me.md")) {
            throw "the upgrade destroyed the user's documents"
          }
          if ((Get-Content "$state\.env" -Raw) -notmatch 'upgrade-marker') {
            throw "the upgrade destroyed the user's configuration"
          }
          if (Test-Path $stale) {
            throw "the upgrade left a file $newVersion does not ship: $stale"
          }
          Write-Host "upgraded $oldVersion -> $after, state intact, runtime replaced ($(Get-Date -Format HH:mm:ss))"

          # --- and again, the way the app actually does it -----------------
          # Everything above upgrades an install sitting still. The app is
          # never sitting still: it hands the installer to a detached helper
          # from its own shutdown path, while it is still running and still
          # holding its executable and every DLL under _internal. That last
          # hop had never been run anywhere.
          #
          # So put the old build back, start it, and hand the upgrade to the
          # command the app itself builds - not an approximation of it - with
          # the app's own pid to wait on. Then end the app, as its own exit
          # would.
          Start-Process -FilePath (Resolve-Path old-setup.exe) `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $reverted = (& "$app\openknowledge.exe" --version) -join ''
          if ($reverted -notmatch [regex]::Escape($oldVersion)) {
            throw "could not put $oldVersion back: --version says '$reverted'"
          }
          # Again, for the harder path: this time the app will be *running* and
          # holding these files when the installer clears them. Re-planted
          # because the upgrade above removed it - and asserted present, so
          # this half cannot pass vacuously either.
          Set-Content -Path $stale -Value "shipped by $oldVersion, not by $newVersion"
          if (-not (Test-Path $stale)) { throw "could not re-plant the stale file at $stale" }

          # The state this runs against, told to want no models: the app
          # below is the real desktop launcher, and a launcher that decides
          # it needs its 2.6 GB is windows-e2e's job, not this one. Written
          # first, because plan_launch reads persisted state rather than this
          # shell's environment.
          $env:OK_STATE_DIR = "$env:TEMP\ok-upgrade-state"
          New-Item -ItemType Directory -Force -Path $env:OK_STATE_DIR | Out-Null
          Set-Content -Path "$env:OK_STATE_DIR\.env" -Value @(
            "OK_LOCAL_ENABLED=false",
            "OK_EMBEDDING_ENABLED=false"
          )

          # The windowed entry, which is what the Start-menu shortcut runs and
          # therefore what sys.executable points at when the app hands off its
          # own upgrade. This used to start `openknowledge.exe serve`, which
          # holds the same files but is the CLI - and the CLI is what the
          # handoff was then told to relaunch. With no subcommand it prints a
          # usage error and exits, so the last hop of this test relaunched
          # nothing at all, for as long as the test has existed. It passed
          # because it only ever read a version string off disk.
          Write-Host "starting the old build ($(Get-Date -Format HH:mm:ss))"
          $running = Start-Process -FilePath "$app\OpenKnowledgeApp.exe" -PassThru
          $up = $false
          foreach ($i in 1..60) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8080/healthz" -TimeoutSec 1
              $up = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) {
            throw "the old build never served, so there was nothing to upgrade under load"
          }
          if ($health.version -notmatch [regex]::Escape($oldVersion)) {
            throw "the running old build reports $($health.version), expected $oldVersion"
          }
          Write-Host "old build serving as pid $($running.Id), reporting $($health.version)"

          $json = uv run python tools/print_handoff.py $new.FullName "$app\OpenKnowledgeApp.exe" $running.Id
          $argv = $json | ConvertFrom-Json
          Write-Host "handoff: $($argv[-1])"
          Start-Process -FilePath $argv[0] -ArgumentList $argv[1..($argv.Length - 1)]

          # The app's own exit. The helper is already waiting on this pid.
          Start-Sleep -Seconds 2
          Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue

          # What the helper does next, in order: wait for that pid, run the
          # installer to completion, then start the app again. So the thing
          # to wait for is the app answering as the NEW version - which is
          # the last hop, the one a person experiences as "it closed, updated
          # and reopened", and which nothing here had ever checked.
          #
          # A version string on disk is not that signal, and used to be the
          # whole check. Inno writes the version-named .dist-info that
          # `--version` reads 3.0s into a 6.6s install, with 400 files still
          # to be replaced, so a probe inside that window reports the new
          # version out of a half-installed directory. The 0.5.0 release run
          # did exactly that: it declared the upgrade landed 1.9 seconds
          # before the installer finished, and an earlier probe crashed
          # reading a base_library.zip being overwritten underneath it - a
          # ZipImportError the retry loop absorbed, leaving a traceback
          # inside a green run.
          #
          # /healthz answers from the process that is actually running, so it
          # cannot be satisfied by a directory that is still being written,
          # and it cannot be satisfied by the old build either: it reports
          # the version it was built as.
          # Bounded so a failure is a message rather than the job's own
          # 15-minute timeout, and bounded generously: two runs reopened in
          # 15 seconds and the third took 119, which is unexplained and was
          # 30 seconds from failing a release for a reason that is not the
          # product's. Hence the progress line - the next slow run says where
          # the time went instead of leaving somebody to subtract timestamps
          # by hand - and a budget that a slow runner cannot trip.
          $clock = [Diagnostics.Stopwatch]::StartNew()
          Write-Host "waiting for the app to come back ($(Get-Date -Format HH:mm:ss))"
          $landed = $false
          foreach ($i in 1..180) {
            Start-Sleep -Seconds 1
            $saw = "nothing listening on 8080"
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8080/healthz" -TimeoutSec 1
              $saw = "serving $($health.version)"
              if ($health.version -match [regex]::Escape($newVersion)) { $landed = $true; break }
            } catch { }
            if ($i % 15 -eq 0) { Write-Host "  ${i}s: $saw" }
          }
          if (-not $landed) {
            Write-Host "--- processes ---"
            Get-Process -Name OpenKnowledgeApp,openknowledge -ErrorAction SilentlyContinue |
              Select-Object Id, ProcessName | Out-String | Write-Host
            Write-Host "--- metadata the frozen app can see ---"
            Get-ChildItem "$app\_internal" -Filter "openknowledge-*.dist-info" -ErrorAction SilentlyContinue |
              Select-Object Name | Out-String | Write-Host
            # No 2>&1: this step runs with $ErrorActionPreference = 'stop',
            # under which redirecting a native command's stderr turns its
            # first line into a terminating error - replacing the message
            # that explains what it means. Unredirected it prints to the log
            # where a reader wants it.
            $now = (& "$app\openknowledge.exe" --version) -join ''
            throw "the app never came back as $newVersion after handing off its own upgrade (on disk: '$now')"
          }
          Stop-Process -Name OpenKnowledgeApp -Force -ErrorAction SilentlyContinue
          if (Test-Path $stale) {
            throw "the upgrade under load left a file $newVersion does not ship: $stale"
          }
          Write-Host ("the app handed off its own upgrade while running, reopened, and served " +
            "as $($health.version) after $([int]$clock.Elapsed.TotalSeconds)s")

      # Win, lose or hang: a killed step never reaches its own Write-Host, and
      # Inno's log is the only account of what the installer did.
      - name: Installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-installer-logs
          path: install-*.log
          if-no-files-found: ignore

  # The whole product, from the installer a person would download: silent
  # install, first launch of the installed app (real 2.6 GB model download
  # against the pinned hashes, real llama-server on the runner's CPU), a real
  # document uploaded through the API, a real question answered by the real
  # model at $0, and the same question again returning the same bytes.
  #
  # Dispatch-only: it pulls 2.6 GB from Hugging Face per run, which is not a
  # per-push cost. It drives the console entry (openknowledge.exe desktop)
  # rather than the windowed one so every launcher line lands in a log; both
  # run the identical launcher code path.
  windows-e2e:
    needs: windows-installer
    # On demand, and on every release tag: an installer nobody installed
    # does not get published.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenKnowledge-Setup

      # One step from install to answered question: the launched process must
      # outlive every check, and a single step leaves no room for questions
      # about what survives a step boundary. OK_HEADLESS keeps first-run
      # progress on the console (visible in this log); the first Windows e2e
      # died in under a second with empty logs, so an early exit now reports
      # the process exit code instead of a bare "never reached serving".
      - name: Install, launch, download models, ask, ask again
        id: launch
        shell: pwsh
        env:
          OK_HEADLESS: "1"
        run: |
          $setup = Get-ChildItem OpenKnowledge-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\OpenKnowledge"
          # No OK_STATE_DIR override: the true first run - app mode, per-user
          # state, admin token minted, uploads on.
          $p = Start-Process -FilePath "$app\openknowledge.exe" -ArgumentList "desktop" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput desktop-out.log -RedirectStandardError desktop-err.log
          "pid=$($p.Id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          function Dump-Logs {
            foreach ($f in "desktop-out.log","desktop-err.log") {
              if (Test-Path $f) { Write-Host "== $f"; Get-Content $f -Tail 80 }
            }
          }

          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Host "launcher exited immediately with code $($p.ExitCode)"
            Dump-Logs
            throw "the launcher died at startup (exit $($p.ExitCode))"
          }

          # The app must serve within seconds now - first run happens in the
          # browser AFTER serving, not before it.
          $started = Get-Date
          $ok = $false
          foreach ($i in 1..120) {
            if ($p.HasExited) {
              Write-Host "launcher exited with code $($p.ExitCode) before serving"
              Dump-Logs
              throw "the launcher died at startup (exit $($p.ExitCode))"
            }
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:8080/healthz" -TimeoutSec 3
              if ($r.status -eq "ok") { $ok = $true; break }
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { Dump-Logs; throw "the app did not serve within a minute" }
          $serving = [math]::Round(((Get-Date) - $started).TotalSeconds)
          Write-Host "serving after ${serving}s (before any model exists)"

          $h = Invoke-RestMethod -Uri "http://127.0.0.1:8080/healthz"
          if (-not $h.upload_enabled) { throw "app-mode provisioning did not enable uploads" }
          $env_file = "$env:LOCALAPPDATA\OpenKnowledge\.env"
          if (-not (Select-String -Path $env_file -Pattern "OK_ADMIN_TOKEN" -Quiet)) {
            throw "no admin token was minted into $env_file"
          }

          # First run asks before downloading; the click is a POST.
          $s = Invoke-RestMethod -Uri "http://127.0.0.1:8080/setup/status"
          if ($s.state -ne "waiting") { throw "first run should wait for consent, got '$($s.state)'" }
          Invoke-RestMethod -Uri "http://127.0.0.1:8080/setup/download" -Method Post | Out-Null
          Write-Host "consented; downloading in the app"

          $deadline = (Get-Date).AddMinutes(20)
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) {
              Write-Host "launcher exited with code $($p.ExitCode) during first run"
              Dump-Logs
              throw "the launcher died mid-first-run (exit $($p.ExitCode))"
            }
            $s = Invoke-RestMethod -Uri "http://127.0.0.1:8080/setup/status" -TimeoutSec 3
            if ($s.state -eq "ready") { break }
            if ($s.state -eq "failed") { Dump-Logs; throw "first run failed: $($s.message)" }
            if ($s.state -eq "stalled") {
              Write-Host "stalled ($($s.message)); pressing Resume"
              Invoke-RestMethod -Uri "http://127.0.0.1:8080/setup/download" -Method Post | Out-Null
            }
            $done = ($s.files | Measure-Object -Property done -Sum).Sum
            $waited = [math]::Round(((Get-Date) - $started).TotalSeconds)
            if ($waited % 30 -lt 5) { Write-Host "state=$($s.state) bytes=$done (${waited}s) $($s.message)" }
            Start-Sleep -Seconds 5
          }
          if ($s.state -ne "ready") { Dump-Logs; throw "first run never reached ready" }
          $ready = [math]::Round(((Get-Date) - $started).TotalSeconds)
          Write-Host "first run complete after ${ready}s"

          Set-Content -Path pet-policy.md -Value @"
          # Office Pets Policy

          Dogs are welcome in the office.

          A pet cleaning fee of EUR 15 per month applies to every registered pet.
          "@
          $up = Invoke-RestMethod -Uri "http://127.0.0.1:8080/documents" -Method Post `
            -Form @{ files = Get-Item pet-policy.md }
          if ($up.corpus.documents -lt 1) { throw "the upload did not index" }
          Write-Host "indexed: $($up.corpus.documents) documents, $($up.corpus.chunks) chunks"

          $body = @{ question = "What is the monthly pet cleaning fee?" } | ConvertTo-Json
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $a1 = Invoke-RestMethod -Uri "http://127.0.0.1:8080/chat" -Method Post `
            -ContentType "application/json" -Body $body -TimeoutSec 600
          $sw.Stop()
          Write-Host "tier=$($a1.tier) grounded=$($a1.grounded) cost=$($a1.cost_usd) seconds=$([math]::Round($sw.Elapsed.TotalSeconds,1))"
          Write-Host "answer: $($a1.answer)"
          if ($a1.answer -notmatch "15") { throw "the answer does not contain the fee: $($a1.answer)" }
          if (-not $a1.grounded) { throw "the answer was not grounded" }
          if ($a1.cost_usd -ne 0) { throw "a local answer must cost zero, got $($a1.cost_usd)" }

          # The second asker gets the first asker's answer, byte for byte.
          $a2 = Invoke-RestMethod -Uri "http://127.0.0.1:8080/chat" -Method Post `
            -ContentType "application/json" -Body $body -TimeoutSec 60
          if ($a2.answer -ne $a1.answer) { throw "the same question twice returned different bytes" }
          if (-not $a2.cached) { throw "the second ask was not served from cache" }
          Write-Host "second ask: tier=$($a2.tier) cached=$($a2.cached), answer identical"

      - name: Stop the app
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.launch.outputs.pid }}") {
            taskkill /F /T /PID ${{ steps.launch.outputs.pid }} 2>$null
          }
          exit 0

      - name: Launcher and server logs
        if: always()
        shell: pwsh
        run: |
          foreach ($f in "desktop-out.log","desktop-err.log") {
            if (Test-Path $f) { Write-Host "== $f"; Get-Content $f -Tail 80 }
          }
          $logs = "$env:LOCALAPPDATA\OpenKnowledge\data\logs"
          if (Test-Path $logs) {
            foreach ($f in Get-ChildItem $logs -File) {
              Write-Host "== $($f.Name)"; Get-Content $f.FullName -Tail 40
            }
          }
