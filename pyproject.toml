[project]
name = "openknowledge"
version = "0.1.0"
description = "Cheap, private, deterministic enterprise document Q&A. Self-hosted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "OpenKnowledge contributors" }]
keywords = ["rag", "enterprise-search", "chatbot", "self-hosted", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
openknowledge = "openknowledge.cli:main"

[project.urls]
Homepage = "https://github.com/FedericoTs/OpenKnowledge"
Source = "https://github.com/FedericoTs/OpenKnowledge"
Issues = "https://github.com/FedericoTs/OpenKnowledge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openknowledge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["openknowledge"]
mypy_path = "src"
ignore_missing_imports = true
