[project]
name = "openknowledge"
version = "0.3.0"
description = "Cheap, private, deterministic enterprise document Q&A. Self-hosted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "OpenKnowledge contributors" }]
keywords = ["rag", "enterprise-search", "chatbot", "self-hosted", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # Multipart form parsing, which is how documents are uploaded. FastAPI
  # imports it lazily the first time an UploadFile route is hit, so forgetting
  # it here fails at runtime on the first drag-and-drop, not at import - the
  # AST dependency audit cannot see it either, which is why it gets a comment.
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
  # Document parsing. Core rather than an extra: a tool for answering questions
  # about company documents that cannot open a PDF is not usable.
  #
  # All permissive (MIT / BSD-3). PyMuPDF is faster and better at PDF than
  # pdfplumber, and is deliberately NOT used: it is AGPL, which is compatible
  # with this project's own licence but would remove the option of commercial
  # licensing that ADR 0002 exists to preserve.
  # Dense retrieval's similarity search: one matrix-vector product per query.
  # Runtime, not an extra, because hybrid retrieval is on by default - and it
  # was shipped undeclared, working here only because a test tool happened to
  # drag numpy in, which is exactly the failure tests/test_dependencies.py now
  # exists to catch.
  "numpy>=1.26",           # BSD-3
  # Where per-user state lives when there is no project directory - the
  # double-clicked-app case. Tiny, pure Python, no transitive dependencies.
  "platformdirs>=4.0",     # MIT
  "pdfplumber>=0.11",      # MIT - PDF text, tables, and glyph geometry
  "python-docx>=1.1",      # MIT - Word
  "openpyxl>=3.1",         # MIT - Excel
  "python-pptx>=1.0",      # MIT - PowerPoint
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# OpenDataLoader PDF (Apache-2.0): a Java parser that reports a document's
# real structure instead of inferring it from geometry. An extra rather than a
# core dependency because it needs a JVM - which the container has and a bare
# pip install does not. Without it the pdfplumber backend is used.
opendataloader = ["opendataloader-pdf>=2.5"]
# The tray icon of the desktop app. An extra because a server has no tray:
# the launcher degrades to a plain wait loop when these are absent.
# quantprobe (MIT, by this project's author) probes the machine and plans
# where the model fits - the flags llama-server starts with. Optional and
# fail-open: absent or broken, the launcher's GPU-then-CPU floor applies.
desktop = ["pystray>=0.19.5", "pillow>=10", "quantprobe>=1.37"]
# Building the desktop bundle (`packaging/pyinstaller/openknowledge.spec`).
# Not dev: nothing in the test suite needs it.
packaging = ["pyinstaller>=6.11"]
# Counting tokens without calling a model, for `tools/measure_prompts.py`.
# Deliberately not a runtime dependency: the running system takes token counts
# from the provider's own usage response, and an estimator in that path would
# put a guess into the ledger.
measure = ["tiktoken>=0.7"]
# Browser-driven checks on the public page: horizontal overflow at phone widths,
# fonts that 404, contrast in both themes. None of those are visible from the
# HTML, and all three have been real. An extra rather than a dev dependency
# because it also needs a browser installed; without it those tests skip and
# the rest of the suite is unaffected.
#
#     uv pip install -e ".[dev,browser]" && playwright install chromium
browser = ["playwright>=1.40"]
# Sign-in for the company server (docs/ENTRA-SIGNIN.md). PyJWT[crypto] pulls
# cryptography for RS256; the two HTTP calls ride the httpx we already ship.
# An extra because a deployment with OK_AUTH_MODE=off never imports any of it.
auth = ["PyJWT[crypto]>=2.8"]
dev = [
  "pytest>=8.3",
  "tiktoken>=0.7",
  "reportlab>=4.0",  # BSD - generates the PDF fixtures the parser tests read
  "PyJWT[crypto]>=2.8",  # also in the auth extra - the auth tests need it

  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
openknowledge = "openknowledge.cli:main"

[project.urls]
Homepage = "https://github.com/FedericoTs/OpenKnowledge"
Source = "https://github.com/FedericoTs/OpenKnowledge"
Issues = "https://github.com/FedericoTs/OpenKnowledge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openknowledge"]

# The widget and the site travel inside the package, so a wheel install can
# actually serve them. Without this, `pip install openknowledge` produced a
# server whose / answered "Chat widget not found" - every test passed, because
# every test ran against the checkout where the old parents[3] lookup worked.
[tool.hatch.build.targets.wheel.force-include]
"web" = "openknowledge/web"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
asyncio_mode = "auto"

[tool.mypy]
# No python_version pin: each CI leg checks with its own interpreter, because
# dependencies ship stubs for the python they were installed under - numpy on
# 3.12 uses `type` statements that a 3.11-pinned mypy refuses to parse. Our
# own 3.11 compatibility is enforced by the 3.11 leg itself.
packages = ["openknowledge"]
mypy_path = "src"
ignore_missing_imports = true
