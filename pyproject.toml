[project]
name = "openknowledge"
version = "0.1.0"
description = "Cheap, private, deterministic enterprise document Q&A. Self-hosted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "OpenKnowledge contributors" }]
keywords = ["rag", "enterprise-search", "chatbot", "self-hosted", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  # Document parsing. Core rather than an extra: a tool for answering questions
  # about company documents that cannot open a PDF is not usable.
  #
  # All permissive (MIT / BSD-3). PyMuPDF is faster and better at PDF than
  # pdfplumber, and is deliberately NOT used: it is AGPL, which is compatible
  # with this project's own licence but would remove the option of commercial
  # licensing that ADR 0002 exists to preserve.
  "pdfplumber>=0.11",      # MIT - PDF text, tables, and glyph geometry
  "python-docx>=1.1",      # MIT - Word
  "openpyxl>=3.1",         # MIT - Excel
  "python-pptx>=1.0",      # MIT - PowerPoint
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# OpenDataLoader PDF (Apache-2.0): a Java parser that reports a document's
# real structure instead of inferring it from geometry. An extra rather than a
# core dependency because it needs a JVM - which the container has and a bare
# pip install does not. Without it the pdfplumber backend is used.
opendataloader = ["opendataloader-pdf>=2.5"]
# Counting tokens without calling a model, for `tools/measure_prompts.py`.
# Deliberately not a runtime dependency: the running system takes token counts
# from the provider's own usage response, and an estimator in that path would
# put a guess into the ledger.
measure = ["tiktoken>=0.7"]
dev = [
  "pytest>=8.3",
  "tiktoken>=0.7",
  "reportlab>=4.0",  # BSD - generates the PDF fixtures the parser tests read

  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
openknowledge = "openknowledge.cli:main"

[project.urls]
Homepage = "https://github.com/FedericoTs/OpenKnowledge"
Source = "https://github.com/FedericoTs/OpenKnowledge"
Issues = "https://github.com/FedericoTs/OpenKnowledge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openknowledge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["openknowledge"]
mypy_path = "src"
ignore_missing_imports = true
