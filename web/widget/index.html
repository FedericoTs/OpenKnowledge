<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenKnowledge</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a19; --muted: #6b6b66;
    --line: #e5e4e0; --accent: #2f5d50; --free: #2f5d50; --paid: #8a5a2b;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191917; --panel:#232320; --ink:#eceae4; --muted:#9a978e;
            --line:#35342f; --accent:#7fb3a2; --free:#7fb3a2; --paid:#d0a06a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-sans-serif,
         system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 96px; }
  header { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  h1 { font-size:19px; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
  #log { display:flex; flex-direction:column; gap:16px; }
  .msg { padding:14px 16px; border-radius:var(--radius); border:1px solid var(--line); }
  .q { background:transparent; border-style:dashed; }
  .q b { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;
         letter-spacing:.06em; display:block; margin-bottom:4px; }
  .a { background:var(--panel); }
  .a p { margin:0 0 10px; white-space:pre-wrap; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px;
          padding-top:10px; border-top:1px solid var(--line); font-size:12px; }
  .badge { padding:2px 8px; border-radius:999px; border:1px solid currentColor;
           font-weight:600; font-size:11px; letter-spacing:.03em; }
  .badge.free { color:var(--free); } .badge.paid { color:var(--paid); }
  .meta .dim { color:var(--muted); }
  .cites { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .cite { font-size:12.5px; color:var(--muted); border-left:2px solid var(--line);
          padding-left:10px; }
  .cite b { color:var(--ink); font-weight:600; }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg);
         border-top:1px solid var(--line); padding:14px 20px; }
  .row { max-width:720px; margin:0 auto; display:flex; gap:8px; }
  input { flex:1; padding:11px 13px; font:inherit; color:inherit; background:var(--panel);
          border:1px solid var(--line); border-radius:var(--radius); }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { padding:11px 18px; font:inherit; font-weight:600; color:var(--bg);
           background:var(--accent); border:0; border-radius:var(--radius); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .err { color:#b3261e; } @media (prefers-color-scheme:dark){ .err{color:#f2b8b5;} }
  /* Text that is still generating and has not passed the grounding gate yet.
     Visibly not-final: the whole streaming bargain is that the reader can see
     it, so the reader must be able to tell it is unverified. */
  .prov p { opacity:.75; }
  .prov .caret { display:inline-block; width:7px; height:14px; margin-left:2px;
                 background:var(--accent); vertical-align:-2px;
                 animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion:reduce){ .prov .caret { animation:none; } }
  .working { color:var(--muted); font-size:13px; }
  .working time { font-variant-numeric:tabular-nums; }
  /* An answer the gate withdrew. It stays on screen, struck through, because
     hiding it would be pretending it was never shown. */
  .retracted p { text-decoration:line-through; opacity:.45; }
  .retract-note { font-size:12.5px; color:var(--paid); margin-top:8px; }
  #add-docs { color:var(--accent); cursor:pointer; text-decoration:underline;
              text-underline-offset:2px; }
  #dropzone { position:fixed; inset:0; display:none; place-items:center; z-index:9;
              background:color-mix(in srgb, var(--bg) 82%, transparent);
              border:3px dashed var(--accent); }
  #dropzone.active { display:grid; }
  #dropzone p { font-size:18px; font-weight:600; color:var(--accent); }
  .sys { border-style:dashed; color:var(--muted); font-size:13.5px; }
  .sys b { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>OpenKnowledge</h1></header>
  <p class="sub">Answers come only from your indexed documents, with the source for each one.</p>
  <p class="sub" id="corpus"></p>
  <div id="dropzone" aria-hidden="true"><p>Drop documents to add them to the knowledge base</p></div>
  <input id="file-input" type="file" multiple hidden
         accept=".pdf,.docx,.xlsx,.xlsm,.pptx,.md,.markdown,.rst,.txt">
  <div id="log"></div>
</div>

<form id="form">
  <div class="row">
    <input id="q" autocomplete="off" placeholder="Ask about a policy or procedure&hellip;" required>
    <button id="send" type="submit">Ask</button>
  </div>
</form>

<script>
// What is indexed, stated rather than asked. "How many documents do you have?"
// is a question *about* the corpus, not one answerable *from* it, so the model
// rightly refuses it - which reads as the system not knowing what it holds.
// The count is a fact the server already has; showing it beats refusing it.
let uploadsEnabled = false;

function refreshCorpusLine() {
  return fetch('healthz').then(r => r.ok ? r.json() : null).then(h => {
    if (!h) { return; }
    uploadsEnabled = !!h.upload_enabled;
    const docs = h.documents_indexed, bits = h.chunks_indexed;
    const el = document.getElementById('corpus');
    el.textContent = docs
      ? `${docs} document${docs === 1 ? '' : 's'} indexed, in ${bits} passage${bits === 1 ? '' : 's'}. `
      : (uploadsEnabled
          ? 'No documents yet. '
          : 'No documents indexed yet - put files in your documents folder and run `openknowledge index`.');
    if (uploadsEnabled && !document.getElementById('add-docs')) {
      const add = el.appendChild(document.createElement('span'));
      add.id = 'add-docs';
      add.textContent = docs ? 'Add more' : 'Add documents';
      add.onclick = () => document.getElementById('file-input').click();
    }
  }).catch(() => {});
}
refreshCorpusLine();

// The desktop app's first run happens in the browser: while models are
// still being consented to, downloaded or loaded, the chat hands over to
// the setup page. On a server deployment the status is always "ready" and
// this never fires.
fetch('/setup/status').then(r => r.json()).then(body => {
  if (body.state && body.state !== 'ready') location.replace('/setup');
}).catch(() => {});

// Drag a file anywhere onto the page and it becomes knowledge. The report the
// server sends back is shown as a message in the conversation, because that is
// where the person is looking - including what was refused, and why.
(function () {
  const zone = document.getElementById('dropzone');
  let depth = 0;
  document.addEventListener('dragenter', (e) => {
    if (!uploadsEnabled || ![...(e.dataTransfer?.types || [])].includes('Files')) return;
    depth += 1; zone.classList.add('active');
  });
  document.addEventListener('dragleave', () => {
    if (depth > 0 && (depth -= 1) === 0) zone.classList.remove('active');
  });
  document.addEventListener('dragover', (e) => { if (uploadsEnabled) e.preventDefault(); });
  document.addEventListener('drop', (e) => {
    if (!uploadsEnabled) return;
    e.preventDefault(); depth = 0; zone.classList.remove('active');
    if (e.dataTransfer?.files?.length) uploadFiles(e.dataTransfer.files);
  });
  document.getElementById('file-input').addEventListener('change', (e) => {
    if (e.target.files.length) uploadFiles(e.target.files);
    e.target.value = '';
  });
}());

async function uploadFiles(fileList) {
  const note = el('div', 'msg sys');
  note.appendChild(el('p', null,
    'Adding ' + fileList.length + ' document' + (fileList.length === 1 ? '' : 's') + '…'));
  log.appendChild(note);
  window.scrollTo(0, document.body.scrollHeight);

  const form = new FormData();
  for (const f of fileList) form.append('files', f, f.name);
  try {
    const res = await fetch('/documents', { method: 'POST', body: form });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const report = await res.json();
    note.textContent = '';
    for (const s of report.stored) {
      const p = el('p');
      p.appendChild(el('b', null, s.name));
      p.appendChild(document.createTextNode(
        s.replaced ? ' — replaced the previous version.' : ' — added.'));
      note.appendChild(p);
    }
    for (const s of report.skipped) {
      const p = el('p');
      p.appendChild(el('b', null, s.name));
      p.appendChild(document.createTextNode(' — not added: ' + s.reason));
      note.appendChild(p);
    }
    if (report.corpus && report.corpus.documents !== undefined) {
      const c = report.corpus;
      let line = 'The knowledge base now holds ' + c.documents + ' document'
        + (c.documents === 1 ? '' : 's') + ' in ' + c.chunks + ' passages.';
      if (c.conflicts_open) {
        line += ' ' + c.conflicts_open + ' contradiction'
          + (c.conflicts_open === 1 ? '' : 's') + ' between documents '
          + (c.conflicts_open === 1 ? 'is' : 'are')
          + ' open — questions they touch will be refused until resolved.';
      }
      note.appendChild(el('p', null, line));
    }
    refreshCorpusLine();
  } catch (err) {
    note.textContent = '';
    note.appendChild(el('p', 'err', 'Upload failed: ' + err.message));
  }
  window.scrollTo(0, document.body.scrollHeight);
}

const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('q');
const send = document.getElementById('send');

const FREE_TIERS = new Set(['pinned', 'exact', 'semantic']);
const TIER_LABEL = {
  pinned: 'pinned answer', exact: 'from cache', semantic: 'from cache',
  local: 'local model', frontier: 'escalated', refused: 'no answer',
};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function renderAnswer(data) {
  const box = el('div', 'msg a');
  box.appendChild(el('p', null, data.answer));

  if (data.citations && data.citations.length) {
    const cites = el('div', 'cites');
    for (const c of data.citations) {
      const d = el('div', 'cite');
      d.appendChild(el('b', null, c.document_title + (c.locator ? ' · ' + c.locator : '')));
      d.appendChild(document.createTextNode(' — ' + c.snippet));
      cites.appendChild(d);
    }
    box.appendChild(cites);
  }

  const meta = el('div', 'meta');
  const free = FREE_TIERS.has(data.tier);
  meta.appendChild(el('span', 'badge ' + (free ? 'free' : 'paid'),
                      TIER_LABEL[data.tier] || data.tier));
  meta.appendChild(el('span', 'dim',
    free ? 'no model call · $0.00' : data.model + ' · $' + data.cost_usd.toFixed(5)));
  for (const note of data.notes || []) meta.appendChild(el('span', 'dim', '· ' + note));
  box.appendChild(meta);
  return box;
}

// The conversation so far, sent with each question so a follow-up like
// "what about contractors?" can be interpreted. The server stays stateless:
// this tab owns its transcript.
const transcript = [];
function remember(role, content) {
  transcript.push({ role, content: content.slice(0, 3800) });
  while (transcript.length > 12) transcript.shift();
}

// The stages a slow answer passes through, written for the person waiting.
const STAGE_TEXT = {
  answering: 'Reading the sources…',
  escalating: 'That attempt failed its checks — trying a stronger model…',
};

function workingLine(pending) {
  const line = el('p', 'working');
  const started = Date.now();
  line.appendChild(document.createTextNode('Looking… '));
  const clock = el('time');
  line.appendChild(clock);
  const tick = setInterval(() => {
    clock.textContent = Math.round((Date.now() - started) / 1000) + 's';
  }, 1000);
  pending.appendChild(line);
  return {
    set(text) { line.firstChild.textContent = text + ' '; },
    stop() { clearInterval(tick); line.remove(); },
  };
}

// Server-sent events over fetch, because EventSource cannot POST a body.
async function streamAnswer(body, pending) {
  const res = await fetch('/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

  const status = workingLine(pending);
  let prov = null, provText = null;
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  const handle = (event) => {
    if (event.type === 'resolved') {
      // The follow-up was read as a standalone question; show which one, so
      // a wrong interpretation is visible instead of silently answered.
      pending.appendChild(el('p', 'working', 'Understood as: ' + event.question));
    } else if (event.type === 'status' && STAGE_TEXT[event.stage]) {
      status.set(STAGE_TEXT[event.stage]);
    } else if (event.type === 'provisional') {
      prov = el('div', 'prov');
      provText = el('p');
      provText.appendChild(document.createTextNode(''));
      provText.appendChild(el('span', 'caret'));
      prov.appendChild(provText);
      pending.appendChild(prov);
      status.set('Generating — unverified until checked…');
    } else if (event.type === 'delta' && provText) {
      provText.firstChild.textContent += event.text;
      window.scrollTo(0, document.body.scrollHeight);
    } else if (event.type === 'retract' && prov) {
      prov.className = 'retracted';
      prov.querySelector('.caret')?.remove();
      prov.appendChild(el('div', 'retract-note',
        'Withdrawn — this did not pass the grounding check (' + event.reason + ')'));
      prov = provText = null;
    } else if (event.type === 'final') {
      status.stop();
      remember('assistant', event.response.answer);
      const answer = renderAnswer(event.response);
      // A withdrawn attempt stays visible above the real outcome.
      const kept = pending.querySelectorAll('.retracted');
      if (kept.length) {
        const wrap = el('div', 'msg a');
        for (const r of kept) wrap.appendChild(r);
        for (const child of [...answer.childNodes]) wrap.appendChild(child);
        pending.replaceWith(wrap);
      } else {
        pending.replaceWith(answer);
      }
      return true;
    }
    return false;
  };

  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf('\n\n')) !== -1) {
      const frame = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      for (const line of frame.split('\n')) {
        if (line.startsWith('data:')) {
          if (handle(JSON.parse(line.slice(5)))) return;
        }
      }
    }
  }
  throw new Error('the stream ended without a final answer');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  const q = el('div', 'msg q');
  q.appendChild(el('b', null, 'You asked'));
  q.appendChild(document.createTextNode(question));
  log.appendChild(q);

  input.value = '';
  send.disabled = true;
  const pending = el('div', 'msg a');
  log.appendChild(pending);
  window.scrollTo(0, document.body.scrollHeight);

  const body = { question, channel: 'web', history: transcript.slice() };
  remember('user', question);

  try {
    await streamAnswer(body, pending);
    send.disabled = false;
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
    return;
  } catch (err) {
    // An older server, a proxy that will not stream, or a mid-stream drop:
    // fall back to the plain request rather than failing the question.
    pending.textContent = '';
    pending.appendChild(el('p', null, 'Looking…'));
  }

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    remember('assistant', data.answer);
    pending.replaceWith(renderAnswer(data));
  } catch (err) {
    pending.replaceWith(el('div', 'msg a err', 'Could not reach the server: ' + err.message));
  } finally {
    send.disabled = false;
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
  }
});
input.focus();
</script>
</body>
</html>
