- id: scope-05-part-301-10-sections
  question: What does part 301-10 cover?
  must_cite: [ftr-301-10]
  must_list:
    - "Eligibility for transportation expenses payment"
    - "Authorized transportation methods"
    - "Selection of transportation method"
    - "Liability for unauthorized or indirect travel"
    - "Use of other than coach class accommodations"
    - "Changes to or non-use of common carrier reservations"
    - "Handling of unused Government transportation items"
    - "Requirement to use contract City Pair Program fare"
    - "Exceptions to contract City Pair Program fare usage"
    - "Liability for unauthorized non-contract carrier use"
    - "Compensation for denied seat"
    - "Compensation for voluntarily vacating a seat"
  min_share: 0.6
  tags: [enumeration, headings, cover, structure]
  notes: >
    The field question "what does the document cover", asked of a 17-chunk
    part with 40 sections. Scored against the first twelve section titles.

# --- ordinal: index into the list ---------------------------------------------

- id: scope-06-second-chapter
  question: What is the title of the second chapter of Alice in Wonderland?
  must_cite: [alice]
  must_say: [["Pool of Tears"]]
  must_not_say: ["Rabbit-Hole", "Caucus-Race"]
  tags: [ordinal, structure]
  notes: The field question "what is the priority 2", with a document that has a 2.

# --- summary: an act, a part ----------------------------------------------------

- id: scope-07-summarise-act-one
  question: Summarise the first act of The Importance of Being Earnest.
  must_cite: [earnest]
  must_say:
    - ["Algernon"]
    - ["Jack", "Ernest", "Worthing"]
    - ["Bunbury"]
    - ["Gwendolen"]
    - ["Bracknell"]
  tags: [summary]
  notes: >
    Judgement, kept minimal: any summary of Act I names these. The act is
    ~1,300 lines; whether a summary can be built from six chunks of it is the
    question.

# --- refusals in the same vocabulary --------------------------------------------

- id: scope-08-fourth-act
  question: What happens in the fourth act of The Importance of Being Earnest?
  kind: refusal
  tags: [ordinal, refusal, structure]
  notes: A three-act play. The right answer is that there is no fourth act.

- id: scope-09-murderer
  question: Who is the murderer in Alice's Adventures in Wonderland?
  kind: refusal
  tags: [refusal]
  notes: Nobody is murdered. A system that names one has invented it.

- id: scope-10-thirteenth-chapter
  question: What is the title of chapter thirteen of Alice in Wonderland?
  kind: refusal
  tags: [ordinal, refusal, structure]
  notes: Twelve chapters. The ordinal machinery must not fabricate a thirteenth.
