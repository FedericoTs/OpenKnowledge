# Questions whose answer is a whole document.
#
# Every other set here asks whether the system finds the right fact. This one
# asks whether it can find ALL of something - the shape of eleven of the sixteen
# questions a real install could not answer (evals/measured/fortyfifth-...json).
#
# The corpus is in ./documents and none of it was written here: two Project
# Gutenberg texts converted by tools/gutenberg_to_md.py (structure markers made
# into headings, not a word changed - the originals are in ./sources), and two
# parts of the US Federal Travel Regulation copied byte-for-byte from
# ../golden-ftr/documents, which a test pins.
#
# Every reference list below is read out of the documents by the script that
# wrote this file: the cast list Wilde printed, the chapter titles Carroll
# wrote, the terms the regulation defines, the section headings GSA used. A
# test regenerates them and fails if this file has drifted from the corpus.
#
# Cases tagged `structure` need no model: the document's own headings, list or
# glossary answer them, and CI runs exactly those, deterministically.
#
# `must_list` with `min_share` is the new check: "listed 26 of 82 (32%)" is the
# number every other scorer here was unable to report.
#
# Run:
#   export OK_DOCUMENTS_DIR=$PWD/evals/golden-scope/documents
#   export OK_LOCAL_ENABLED=true OK_EMBEDDING_ENABLED=false OK_ESCALATION_ENABLED=false
#   export OK_LOCAL_BASE_URL=http://127.0.0.1:8081/v1
#   uv run openknowledge eval --path evals/golden-scope/scope.yaml --verbose

# --- enumeration inside the budget: the control, must stay complete ----------

- id: scope-01-transport-methods
  question: What transportation methods may an agency authorize?
  must_cite: [ftr-301-10]
  must_list: ["common carrier", "government vehicle", "privately owned", "special conveyance"]
  min_share: 1.0
  paraphrases:
    - List the authorized methods of transportation.
  tags: [enumeration, control]
  notes: Four items in one chunk. If this ever drops, retrieval broke, not scope.

- id: scope-02-persons-in-the-play
  question: Who are the persons in The Importance of Being Earnest?
  must_cite: [earnest]
  must_list:
    - "John Worthing"
    - "Algernon Moncrieff"
    - "Chasuble"
    - "Merriman"
    - "Lane"
    - "Lady Bracknell"
    - "Gwendolen Fairfax"
    - "Cecily Cardew"
    - "Miss Prism"
  min_share: 1.0
  paraphrases:
    - Who are the characters in the play?
  tags: [enumeration, characters, structure]
  notes: >
    Wilde's own cast list, nine names under one heading - the field question
    "what are the main characters" with the answer stated in the document.

# --- enumeration outside the budget: the failure being measured --------------

